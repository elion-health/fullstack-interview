version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: elion-postgres
    environment:
      POSTGRES_USER: elion
      POSTGRES_PASSWORD: elion_dev_password
      POSTGRES_DB: elion_interview
      # Init into a subdirectory of the mount so the volume root can contain
      # lost+found / other driver artifacts without breaking initdb.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elion -d elion_interview"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
