version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: elion-interview-db
    environment:
      POSTGRES_USER: elion
      POSTGRES_PASSWORD: elion_dev_password
      POSTGRES_DB: elion_interview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elion"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
